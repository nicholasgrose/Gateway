[versions]
# Minecraft dependencies
# https://fabricmc.net/develop/
# https://www.minecraft.net/en-us/articles
minecraft = "26.3"
# https://github.com/FabricMC/fabric-loader
fabric-loader = "0.19.5"
# https://github.com/FabricMC/fabric
fabric = "0.160.7+26.3"
# https://github.com/FabricMC/fabric-language-kotlin/blob/master/README.md
fabric-kotlin = "1.14.1+kotlin.2.4.20"

# Build tools
# https://github.com/FabricMC/fabric-loom
fabric-loom = "1.17-SNAPSHOT"

# Mod Dependencies
# https://github.com/PaperMC/adventure-platform-mod
adventure-platform-fabric = "7.2.0"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric" }
fabric-kotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabric-kotlin" }
adventure-platform-fabric = { group = "net.kyori", name = "adventure-platform-fabric", version.ref = "adventure-platform-fabric" }

[bundles]
fabric = ["fabric", "fabric-loader", "fabric-kotlin"]

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
