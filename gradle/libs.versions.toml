[versions]
# Dependencies
# https://kotlinlang.org/
kotlin = "2.2.0"
# https://insert-koin.io/docs/support/releases/
koin = "4.1.0"
# https://github.com/Kotlin/kotlinx.coroutines
kotlinx-coroutines = "1.10.2"
# https://github.com/Kotlin/kotlinx-datetime
kotlinx-datetime = "0.7.0"

# Test Dependencies
# https://mockk.io
mockk = "1.14.4"

# Build tools
# https://github.com/GradleUp/shadow
#shadow = "8.3.7"

# Testing tools
# https://github.com/klahap/dotenv
#dotenv = "1.1.3"

# Code analysis
# https://github.com/Kotlin/kotlinx-kover
kover = "0.9.1"
# https://detekt.dev/
detekt = "1.23.8"
# https://www.jetbrains.com/help/qodana/deploy-qodana.html#Gradle+plugin
qodana = "2025.1.1"

# Release tools
# https://github.com/JetBrains/gradle-changelog-plugin
#changelog = "2.2.1"

[libraries]
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-test = { module = "io.insert-koin:koin-test", version = "koin" }
koin-test-junit5 = { module = "io.insert-koin:koin-test-junit5", version = "koin" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }

mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }

plugin-kotlin-jvm = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-kotlin-serialization = { group = "org.jetbrains.kotlin.plugin.serialization", name = "org.jetbrains.kotlin.plugin.serialization.gradle.plugin", version.ref = "kotlin" }
#plugin-shadow = { group = "com.gradleup.shadow", name = "shadow-gradle-plugin", version.ref = "shadow" }
#plugin-dotenv = { group = "io.github.klahap.dotenv", name = "dotenv", version.ref = "dotenv" }
plugin-kover = { group = "org.jetbrains.kotlinx", name = "kover-gradle-plugin", version.ref = "kover" }
plugin-detekt = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
plugin-qodana = { group = "org.jetbrains.qodana", name = "plugin", version.ref = "qodana" }
#plugin-changelog = { group = "org.jetbrains.changelog", name = "", version.ref = "changelog" }

[plugins]
#kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
#kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
#shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
#dotenv = { id = "io.github.klahap.dotenv", version.ref = "dotenv" }
#kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
#detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
#qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
#changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }

[bundles]
koin-test = ["koin-test", "koin-test-junit5"]
kotlinx = ["kotlinx-coroutines-core", "kotlinx-datetime"]
